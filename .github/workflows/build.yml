name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Connect IQ SDK + device files, maintained at github.com/matco/connectiq-tester
    # (Garmin's own SDK manager needs a GUI + login, so CI uses this image).
    # Pin to a versioned tag for reproducible builds if desired.
    container:
      image: ghcr.io/matco/connectiq-tester:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make device files visible to the runner user
        run: |
          # The image stores device definitions in /root/.Garmin; GitHub job
          # containers override HOME, so link them into the effective HOME too.
          if [ -n "$HOME" ] && [ "$HOME" != "/root" ]; then
            mkdir -p "$HOME"
            ln -sfn /root/.Garmin "$HOME/.Garmin"
          fi

      - name: Prepare developer key
        env:
          DEVELOPER_KEY_B64: ${{ secrets.CIQ_DEVELOPER_KEY }}
        # Secret = base64 of developer_key.der (base64 -w0). Whitespace and line breaks
        # (also CRLF from the web form) are tolerated, as is a PEM key (-----BEGIN ...).
        run: |
          if ! command -v openssl >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends openssl
          fi
          if [ -n "$DEVELOPER_KEY_B64" ]; then
            echo "Using developer key from CIQ_DEVELOPER_KEY secret"
            if printf '%s' "$DEVELOPER_KEY_B64" | grep -q -- "-----BEGIN"; then
              echo "secret contains a PEM key - converting to DER"
              printf '%s\n' "$DEVELOPER_KEY_B64" | tr -d '\r' > developer_key.pem
              openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt \
                -in developer_key.pem -out developer_key.der
            else
              printf '%s' "$DEVELOPER_KEY_B64" | tr -d ' \t\r\n' | base64 -d > developer_key.der || {
                echo "::error::CIQ_DEVELOPER_KEY is not valid base64 (expected: base64 -w0 developer_key.der)"
                exit 1
              }
              # base64 of the .pem instead of the .der
              if head -c 11 developer_key.der | grep -q -- "-----BEGIN"; then
                echo "secret is base64 of a PEM file - converting to DER"
                mv developer_key.der developer_key.pem
                openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt \
                  -in developer_key.pem -out developer_key.der
              fi
            fi
            openssl pkey -inform DER -in developer_key.der -noout || {
              echo "::error::CIQ_DEVELOPER_KEY does not decode to a DER private key"
              exit 1
            }
            echo "key OK ($(wc -c < developer_key.der) bytes)"
          else
            # A release must be signed with the permanent key (otherwise it is a different
            # app in the store and on the watch, and settings are lost)
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::Release build (tag) requires the CIQ_DEVELOPER_KEY secret"
                exit 1 ;;
            esac
            echo "No CIQ_DEVELOPER_KEY secret set - generating an ephemeral key"
            openssl genrsa -out developer_key.pem 4096 2>/dev/null
            openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt \
              -in developer_key.pem -out developer_key.der
          fi

      - name: Stamp build ID and version
        # source/Build.mc: short commit SHA and the version from manifest.xml (About screen)
        run: |
          SHORT=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          VERSION=$(sed -n -e 's/.*<iq:application[^>]* version="\([^"]*\)".*/\1/p' \
            -e 's/^[[:space:]]*version="\([^"]*\)".*/\1/p' manifest.xml | head -n1)
          [ -n "$VERSION" ] || { echo "::error::manifest.xml has no version"; exit 1; }
          sed -i "s/const ID = \"dev\";/const ID = \"$SHORT\";/; s/const VERSION = \"dev\";/const VERSION = \"$VERSION\";/" source/Build.mc
          grep -q "const VERSION = \"$VERSION\";" source/Build.mc
          echo "build $SHORT, version $VERSION"

      - name: Build (venux1)
        run: |
          monkeyc -d venux1 -f monkey.jungle -o Ahead-venux1.prg \
            -y developer_key.der -w

      - name: Build (venusq2)
        run: |
          monkeyc -d venusq2 -f monkey.jungle -o Ahead-venusq2.prg \
            -y developer_key.der -w

      - name: Upload sideloadable apps
        uses: actions/upload-artifact@v4
        with:
          name: Ahead-prg
          path: Ahead-*.prg
          if-no-files-found: error

      # On v* tags: release (-r) .prg for every device in the manifest
      - name: Release build (all devices)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          IDS=$(sed -n 's/.*<iq:product id="\([^"]*\)".*/\1/p' manifest.xml)
          N=0
          for d in $IDS; do
            echo "== $d"
            monkeyc -d "$d" -f monkey.jungle -o "release/Ahead-$d.prg" -y developer_key.der -r -w
            N=$((N + 1))
          done
          echo "built $N devices"
          [ "$N" -gt 0 ]

      - name: Upload release builds
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Ahead-release-prg
          path: release/Ahead-*.prg
          if-no-files-found: error

      # On version tags, also produce the store-upload package (.iq)
      - name: Export store package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          monkeyc -e -f monkey.jungle -o Ahead.iq -y developer_key.der -w

      - name: Upload store package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Ahead-store-package
          path: Ahead.iq
          if-no-files-found: error
